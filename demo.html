<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        input[type="text"], input[type="email"], input[type="password"], input[type="date"], select, textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <center><h1>Student Registration Form</h1><br>
    <h2>Personal Information</h2></center>
    
    <center>
    <form>
    <table border="3" cellpadding="10">
        <tr>
            <td><label for="name">Full Name:</label></td>
            <td><input type="text" id="name" name="name" required></td>
        </tr>
        <tr>
            <td><label for="email">Email:</label></td>
            <td><input type="email" id="email" name="email" required></td>
        </tr>
        <tr>  
            <td><label for="pass">Password:</label></td>
            <td><input type="password" id="pass" name="pass" required></td>
        </tr>
        <tr>
            <td><label for="date">Date Of Birth:</label></td>
            <td><input type="date" id="date" name="date" required></td>
        </tr>
        <tr>
            <td><label for="gender">Gender:</label></td>
            <td>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label><br>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label><br>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </td>
        </tr>
        <tr>
            <td><label for="country">Select Country:</label></td>
            <td>
                <select id="country" name="country">
                    <option value="india">India</option>
                    <option value="australia">Australia</option>
                    <option value="usa">USA</option>
                    <option value="japan">Japan</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="address">Address:</label></td>
            <td><textarea id="address" name="address" rows="4" cols="50"></textarea></td>
        </tr>
        <tr>
            <td>Preferences:</td>
            <td>
                <input type="checkbox" id="sports" name="preferences" value="Sports">
                <label for="sports">Sports</label><br>
                <input type="checkbox" id="music" name="preferences" value="Music">
                <label for="music">Music</label><br>
                <input type="checkbox" id="reading" name="preferences" value="Reading">
                <label for="reading">Reading</label><br>
                <input type="checkbox" id="traveling" name="preferences" value="Travel">
                <label for="traveling">Travel</label>
            </td>
        </tr>
        <tr>
            <td><label for="experience">Experience Level (1-100):</label></td>
            <td><input type="range" id="experience" name="experience" min="1" max="100"></td>
        </tr>
        <tr>
            <td><label for="photo">Upload Photo:</label></td>
            <td><input type="file" id="photo" name="photo"></td>
        </tr>
        <tr>
            <td colspan="2" style="text-align:center;">
                <input type="submit" value="Submit">
            </td>
        </tr>
    </table>
    </form>
    </center>

</body>
</html>
